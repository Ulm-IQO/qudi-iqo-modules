# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytest Module testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Python matrix from pyproject.toml
        id: build
        run: |
          python .github/workflow_utils/fetch_python_versions.py | jq .
        shell: bash

  test:
    needs: make-matrix
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ${{ fromJson(needs.make-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
        cache-dependency-path: pyproject.toml

    - name: Checkout qudi core
      run: |
        cd ..
        git clone -b pyside6-dev --single-branch https://github.com/astropiu/qudi-core.git
        cd qudi-core
        python -m pip install --upgrade pip
        pip install -e ".[dev-test]"
        cd ../qudi-iqo-modules

    - name: Install dependencies iqo modules
      run: |
        pip install -e ".[dev-test]"

    - name: Force PySide6 (remove PySide2 if present)
      run: |
        python -m pip uninstall -y PySide2 shiboken2 || exit 0
        python -m pip install --upgrade pip
      shell: bash

    - name: Run ODMR tests
      shell: pwsh
      env:
        QUDI_FIT_DEBUG_LOG: ${{ github.workspace }}\qudi_fit_debug.log
        QUDI_RAISE_FIT_ERRORS: "1"
        QT_API: pyside6
      run: |
        pytest -vv -s --tb=long -o log_cli=true --log-cli-level=DEBUG tests/test_OdmrLogic.py::test_do_fit

    - name: Print Qudi debug logs
      if: always()
      shell: pwsh
      run: |
        if (Test-Path "$env:GITHUB_WORKSPACE\qudi_fit_debug.log") {
          Write-Host "===== qudi_fit_debug.log ====="
          Get-Content "$env:GITHUB_WORKSPACE\qudi_fit_debug.log"
        }

        Write-Host "===== Other recent .log files ====="
        Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "*.log" |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 20 |
          ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName -Tail 200
          }
  

